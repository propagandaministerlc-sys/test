name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0). Leave empty for a normal build."
        required: false
        default: ""
      desktop_preview:
        description: "Also take a screenshot of the desktop app (Linux, virtual display)."
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Android apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ultragrid-apk
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: klar-hoerhilfe-apk
          path: hearing/build/outputs/apk/**/*.apk

  windows:
    name: UltraGrid for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer and portable app
        shell: bash
        run: ./gradlew --no-daemon -PdesktopOnly :desktop:packageExe :desktop:createDistributable

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/UltraGrid -DestinationPath UltraGrid-Windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ultragrid-windows
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            UltraGrid-Windows-portable.zip

  desktop-preview:
    name: Desktop screenshot
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon -PdesktopOnly :desktop:createDistributable

      - name: Run and screenshot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick > /dev/null
          mkdir -p demo shots
          convert -size 1600x1200 plasma:fractal -blur 0x2 demo/1.jpg
          convert -size 1200x1600 gradient:'#6CD49C'-'#0A0C0E' demo/2.jpg
          convert -size 1200x1200 plasma:'#F1F1EC'-'#1E2A33' demo/3.jpg
          convert -size 1600x1000 radial-gradient:'#F3B562'-'#1E2A33' demo/4.jpg
          export ULTRAGRID_DEMO_DIR=$PWD/demo
          Xvfb :99 -screen 0 1600x1000x24 & sleep 2
          export DISPLAY=:99
          desktop/build/compose/binaries/main/app/UltraGrid/bin/UltraGrid & sleep 25
          import -window root shots/composition.png

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: shots/*.png

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          cp artifacts/ultragrid-apk/release/app-release.apk "release/UltraGrid-${{ inputs.release_tag }}.apk"
          cp artifacts/klar-hoerhilfe-apk/release/hearing-release.apk "release/Klar-Hoerhilfe-${{ inputs.release_tag }}.apk"
          cp artifacts/ultragrid-windows/desktop/build/compose/binaries/main/exe/*.exe "release/UltraGrid-${{ inputs.release_tag }}-Windows-Setup.exe"
          cp artifacts/ultragrid-windows/UltraGrid-Windows-portable.zip "release/UltraGrid-${{ inputs.release_tag }}-Windows-portable.zip"
          ls -la release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: UltraGrid & Klar ${{ inputs.release_tag }}
          files: release/*
          body: |
            **Android** (Android 10 oder neuer):

            - **UltraGrid-${{ inputs.release_tag }}.apk** – Grid- und Bento-Kompositionen, Profil-Grid, Karussell und Feed-Planer.
            - **Klar-Hoerhilfe-${{ inputs.release_tag }}.apk** – macht AirPods zur Hörhilfe: Stimmen hervorheben, Störgeräusche dämpfen, Hörtest und Equalizer.

            APK auf dem Handy öffnen und installieren. Eventuell musst du „Installation aus unbekannten Quellen“ erlauben.

            **Windows** (Windows 10 oder 11, 64 Bit):

            - **UltraGrid-${{ inputs.release_tag }}-Windows-Setup.exe** – Installer mit Startmenü- und Desktop-Verknüpfung.
            - **UltraGrid-${{ inputs.release_tag }}-Windows-portable.zip** – ohne Installation: entpacken und `UltraGrid.exe` starten.

            Die Dateien sind nicht signiert. Windows SmartScreen fragt deshalb beim ersten Start nach: „Weitere Informationen“ → „Trotzdem ausführen“.

            Klar ist kein Medizinprodukt und ersetzt kein Hörgerät.
